    <link rel="icon" type="" href="img/logo.jpg">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://mrwallpaper.com/images/hd/detective-pikachu-animated-art-s8nni97sx6ybz3hb.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .profile-container {
            width: 100%;
            max-width: 600px; 
            margin: 10px auto; 
            background-image: url('https://www.desktophut.com/images/1708615688.webp'); 
            background-position: center;
            padding: 15px; 
            box-shadow: inset 0 0 200px 1000px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow-y: auto; 
            max-height: 70vh; 
            margin-top: 60px; 
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-picture {
            width: 100px;
            height: 100px; 
            background-color: #cccccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        .profile-info {
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }

        .profile-info div {
            margin-bottom: 10px;
        }

        .profile-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .profile-buttons a , button{
            background-color: #325ca0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            font-size: small;
        }

        .profile-buttons button:hover {
            background-color: #357ae8;
        }

        .achievements{
            background-color: rgba(255, 255, 255, 0.8);
            background-image: url('https://wallpapers-clan.com/wp-content/uploads/2024/04/pokemon-eevee-lovely-pastel-desktop-wallpaper-cover.jpg');
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            color: #333333b7;
            background-size: cover;
            background-blend-mode: lighten;
        }

        .achievements h2{
            margin-top: 0;
            color: #325ca0;
            text-shadow: 1px 1px #fff;
        }

        .achievement-item{
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #cccccc;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-wrap: wrap;
            overflow: hidden;
        }
        
        .score, .date {
            float: left;
            width: 50%;
            margin: 0;
        }

        .achievement-info {
            height: 0;
            overflow: hidden;
            transition: height 0.5s ease, opacity 0.5s ease, padding 0.5s ease;
            opacity: 0;
            margin-top: 10px;
            color: #325ca0;
            text-shadow: 1px 1px white;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            width: 100%;
            padding: 0 10px;
        }

        .achievement-item.expanded .achievement-info {
            opacity: 1;
        }

        .achievement-item:last-child, .badge-item:last-child {
            border-bottom: none;
        }

        .achievement-item .badge{
            border-radius: 50%;
            width: 50px;
            height: 50px;
        }

        .achievement-item img{
            width: 100%;
            height: auto;
        }

        .achievement-item .details{
            flex-grow: 1;
            margin-left: 10px;
            text-align: left;
            color: #325ca0;
            text-shadow: 1px 1px white;
        }

        .achievement-item .trophy{
            color: gold;
        }

        .certbutton {
            display: flex;
            justify-content: right;
            width: 100%;
        }

        .certbutton a{
            border: none;
            background-color: #357ae8;
            padding: 8px 20px 8px 20px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-size: small;
        }
    </style>
</head>
