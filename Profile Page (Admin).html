<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <script src="https://kit.fontawesome.com/a6a6f2e015.js" crossorigin="anonymous"></script>

    <link rel="icon" type="" href="image/logo.jpg">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('img/diamondwp.jpeg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .profile-container {
            width: 100%;
            max-width: 600px; 
            margin: 10px auto; 
            padding: 15px; 
            box-shadow: inset 0 0 200px 1000px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow-y: auto; 
            max-height: 70vh; 
            margin-top: 60px; 
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-picture {
            width: 100px;
            height: 100px; 
            background-color: #cccccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        .profile-info {
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }

        .profile-info div {
            margin-bottom: 10px;
        }

        .profile-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .profile-buttons a , button{
            background-color: #325ca0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-decoration: none;
            font-size: small;
        }

        .profile-buttons button:hover {
            background-color: #357ae8;
        }

    </style>
</head>
<body>

        </ul>

        </ul>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-picture">
                <img id="profile-pic" src="">
            </div>
            <div class="profile-info">
                <div id="user-name">Name: </div>
                <div id="user-age">Age: </div>
                <div id="user-gender">Gender: </div>
                <div id="user-dob">Date of Birth: </div>

        }

        function closeSidebar() {
            document.querySelector('nav ul.sidebar').style.display = 'none';
        }
    </script>
